name: Post to Discord

# Repo activity, posted to the Discord channel under the name and avatar of
# whoever caused it. Who is shown as whom is the table at the top of
# .github/scripts/discord-post.sh.
#
# THIS REPLACES the webhook under Settings, Webhooks whose URL ends in /github.
# Leave that one in place and every event is posted twice: delete it once this
# is working.
#
# SET UP ONCE, by a repo admin: Settings, Secrets and variables, Actions, New
# repository secret, named DISCORD_WEBHOOK_URL, holding the channel's webhook
# URL (without /github on the end). Until then every run says so and stays
# green.
#
# pull_request_target, not pull_request: a pull request from a fork gets no
# secrets under pull_request, so it could not post. This is safe here because
# nothing from the pull request is checked out or run -- the checkout below is
# the base branch, and the event is only ever read as data by jq.
#
# Every trigger but push runs the copy of this file on main, so they start
# working when this is merged.
on:
  push:
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review]
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  # A release published BY THE PACKAGE WORKFLOW never arrives here: GitHub does
  # not start workflows for what a workflow's own token did. package.yml posts
  # that one itself. This is for a release published by hand.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # The default branch, for the script alone. A deleted branch has nothing
      # left to check out, and a pull request's own code is never wanted.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash .github/scripts/discord-post.sh "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"
